name: 自動テスト

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node.js 24で検証
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
