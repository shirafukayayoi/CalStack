<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CalStack</title><link rel="stylesheet" href="content.css"><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><span class="logo">▣</span><div><h1>CalStack</h1><p>重なる予定を、ひとつに。</p></div></header>
  <p id="account" class="account">Googleカレンダーに接続中…</p>
  <form id="settings">
    <label for="company">会社のカレンダー</label><select id="company" required disabled><option value="">選んでください</option></select>
    <label for="personal">自分のカレンダー</label><select id="personal" required disabled><option value="">選んでください</option></select>
    <label class="toggle"><input id="enabled" type="checkbox" disabled><span>重複予定をまとめる</span></label>
    <button id="save" type="submit" disabled>設定を保存</button>
  </form>
  <p id="status" role="status" aria-live="polite">読み込み中…</p>
  <footer>
    <div class="legend"><span class="calstack-badge" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><rect class="calstack-back" x="1.5" y="1.5" width="8.5" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span><span>塗り付き：表示中の会社予定と一致</span></div>
    <div class="legend"><span class="calstack-badge" data-calstack-cached="true" aria-hidden="true"><svg viewBox="0 0 16 16" focusable="false"><rect class="calstack-back" x="1.5" y="1.5" width="8.5" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/><rect x="5.5" y="5.5" width="8.5" height="8.5" rx="1.2" fill="none" stroke="currentColor" stroke-width="1.5"/></svg></span><span>輪郭のみ：会社非表示・前回の一致</span></div>
    <p>会社側を一度表示すると、一致を記録します。<br>予定にカーソルを合わせるか、キーボードでフォーカスすると確認情報が分かります。</p>
  </footer>
  <script src="popup.js"></script>
</body></html>
